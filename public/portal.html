<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f1535">
  <title>専用ページ | Nocturne Planet</title>
  <link rel="icon" href="/assets/logo-dark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css"><script type="module" src="/portal.mjs"></script>
</head>
<body class="portal-body">
  <a class="skip" href="#portal-main">本文へ</a>
  <header class="portal-header">
    <a class="brand" href="/">
      <img src="/assets/logo-dark.svg" alt="" width="44" height="44">
      <span>Nocturne Planet<small id="area-label">専用ページ</small></span>
    </a>
    <div class="header-actions" id="account-actions">
      <a href="/" class="button secondary small pill">公式HPへ</a>
    </div>
  </header>
  <main id="portal-main" class="portal-main">
    <p id="portal-loading" class="login-panel quiet" role="status">ログイン状態を確認しています…</p>
    <section class="login-panel login-card" hidden>
      <img src="/assets/logo-dark.svg" alt="Nocturne Planet" width="112" height="112">
      <h1 id="login-title">会員ページ</h1>
      <p id="login-description">お客さん用Discordサーバーに参加している方が利用できます。</p>
      <div id="login-message" class="notice" role="status" hidden></div>
      <label class="check-row"><input id="remember" type="checkbox" checked>この端末でログインを保持する（30日）</label>
      <p class="quiet">共有端末ではチェックを外してください。</p>
      <a class="button pill discord-button" id="login-button" href="/auth/discord?area=member&remember=1">Discordでログイン</a>
      <p class="login-invite" id="login-invite" hidden>サーバーに未参加の方は <a class="text-link" href="https://discord.gg/5h8ZPCdbE9" target="_blank" rel="noopener noreferrer">お客さん用Discordに参加</a></p>
      <a class="text-link" href="/">公式HPに戻る</a>
    </section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
